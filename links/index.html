.big span{display:block;min-width:0}

.big .go{margin-left:auto;width:22px;height:22px;opacity:.85}

.tt{background:var(--yellow);color:#231C08}
.help{margin-top:auto;padding-top:34px;color:var(--link);font-size:15px;text-align:center}
